<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configure Tailwind to use Inter font -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                },
            },
        }
    </script>

    <!-- External stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-sans h-full flex items-center justify-center p-6 bg-gradient-to-r from-blue-50 to-indigo-100">

    <div class="w-full max-w-lg">
        <!-- Main Card -->
        <div id="feedback-card" class="bg-white rounded-xl shadow-2xl overflow-hidden">
            
            <!-- Form Container -->
            <div id="form-container" class="p-8 md:p-12 form-container">
                <h1 class="text-3xl font-bold text-gray-900 mb-2">Share Your Feedback</h1>
                <p class="text-gray-600 mb-8">We'd love to hear what you think!</p>

                <!-- Feedback Form -->
                <form id="feedbackForm">
                    <!-- Name Field -->
                    <div class="mb-5">
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Name</label>
                        <input type="text" id="name" name="name" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                            placeholder="Abebe Bekele">
                    </div>

                    <!-- Email Field -->
                    <div class="mb-5">
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                        <input type="email" id="email" name="email" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                            placeholder="you@example.com">
                    </div>

                    <!-- Feedback Field -->
                    <div class="mb-8">
                        <label for="message" class="block text-sm font-medium text-gray-700 mb-2">Feedback</label>
                        <textarea id="message" name="message" rows="5" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                            placeholder="Your feedback is invaluable..."></textarea>
                    </div>

                    <!-- Submit Button -->
                    <div>
                        <button type="submit"
                            class="w-full bg-blue-600 text-white font-bold py-3 px-6 rounded-lg shadow-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all transform hover:scale-105">
                            Submit Feedback
                        </button>
                    </div>
                </form>
            </div>

            <!-- Success Message (Initially Hidden) -->
            <div id="success-message"
                 class="p-8 md:p-12 text-center success-message hidden opacity-0 transform scale-95">
                <div class="flex justify-center mb-6">
                    <svg class="w-16 h-16 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <h2 class="text-3xl font-bold text-gray-900 mb-3">Thank You!</h2>
                <p class="text-lg text-gray-700">We've received your feedback and really appreciate you taking the time.</p>
            </div>
            
        </div>
    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
